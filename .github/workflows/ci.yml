name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint --max-warnings=0

      - name: Typecheck files
        run: |
          yarn typecheck

      - name: Typecheck Expo files
        run: |
          yarn expo:typecheck

      - name: Format check
        run: yarn prettier --check

  build-library:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepack

  build-android:
    runs-on: ubuntu-latest
    needs: build-library
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        working-directory: ./example
        run: |
          yarn build:android

  build-ios:
    # Vendored TalsecRuntime fallback (FREERASP_DISABLE_SPM=1) — the required gate.
    # Proves the non-breaking fallback keeps building while the SPM infra is not ready.
    runs-on: macos-latest
    needs: build-library
    env:
      FREERASP_DISABLE_SPM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install pods
        working-directory: ./example/ios
        run: pod install

      - name: Build example for iOS
        working-directory: ./example
        run: |
          yarn build:ios

  build-ios-spm:
    # SPM path (default on RN >= 0.75, dynamic frameworks). Non-blocking until the
    # real manifest-repo/GCS link replaces the placeholder in the podspec; drop
    # continue-on-error to make it a required gate once the SPM infra is live.
    runs-on: macos-latest
    needs: build-library
    continue-on-error: true
    env:
      USE_FRAMEWORKS: dynamic
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install pods (SPM)
        working-directory: ./example/ios
        run: pod install

      - name: Build example for iOS (SPM)
        working-directory: ./example
        run: |
          yarn build:ios
