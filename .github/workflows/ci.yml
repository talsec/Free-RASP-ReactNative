name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint --max-warnings=0

      - name: Typecheck files
        run: |
          yarn typecheck

      - name: Typecheck Expo files
        run: |
          yarn expo:typecheck

      - name: Test Expo plugin
        run: yarn test:plugin

      - name: Format check
        run: yarn prettier --check

  build-library:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepack

  build-android:
    runs-on: ubuntu-latest
    needs: build-library
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        working-directory: ./example
        run: |
          yarn build:android

      - name: 🔑 License backend hint
        if: failure()
        run: |
          echo "::warning::The example app applies app.talsec.plugin, which requests a license token from portal-backend.talsec.app during the build."
          echo "::warning::If the log shows 'Cannot resolve license', check that the backend is up and reachable from the runner before investigating this PR."

  build-ios:
    runs-on: macos-latest
    needs: build-library
    env:
      FREERASP_USE_SPM: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install pods
        working-directory: ./example/ios
        run: pod install

      - name: Build example for iOS
        working-directory: ./example
        run: |
          yarn build:ios

  build-ios-spm:
    runs-on: macos-latest
    needs: build-library
    env:
      USE_FRAMEWORKS: dynamic
      FREERASP_USE_SPM: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install pods (SPM)
        working-directory: ./example/ios
        run: pod install

      - name: Build example for iOS (SPM)
        working-directory: ./example
        run: |
          yarn build:ios
